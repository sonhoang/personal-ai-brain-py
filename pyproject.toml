[project]
name = "personal-ai-brain"
version = "0.1.0"
description = "Local document library with grounded, cited answers from Claude, plus linked notes. SQLite FTS5, MCP server, CLI."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Son Hoang" }]
dependencies = [
    "anthropic>=1.13.0",
    "mcp>=2.3.0",
    "pypdf>=6.20.1",
    "typer>=0.27.3",
]

[project.scripts]
brain = "personal_ai_brain.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_ai_brain"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["SIM905"]  # "a b c".split() reads better than a long list literal

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
